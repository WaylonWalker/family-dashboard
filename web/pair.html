<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pair Family HQ</title><link rel="stylesheet" href="/style.css"><script src="/pair-qr.js" defer></script><style>
body{display:grid;place-items:center;min-height:100vh;padding:16px;margin:0;overflow:auto} .pair-card{width:min(90vw,700px);max-height:calc(100vh - 32px);overflow:auto;text-align:center;background:var(--surface,#fff);color:var(--ink,#172c28);border:1px solid #cbd5d0;border-radius:20px;padding:18px;box-shadow:0 12px 40px #0001} .qr-wrap{display:grid;place-items:center;background:#fff;padding:8px;border-radius:12px;width:fit-content;max-width:100%;margin:12px auto}.qr-wrap svg{display:block;width:30vh;height:30vh;max-width:220px;max-height:30vh} .pair-url{overflow-wrap:anywhere;font-size:12px} h1{font-size:30px;margin:0 0 10px} .pair-small{font-size:15px;opacity:.72}
</style></head><body><main class="pair-card"><h1>Connect this photo frame</h1><p>Scan with your phone. Sign in to hlab-auth and approve this display.</p><div class="qr-wrap" id="pair-qr" data-url="{{.URL}}"></div><p class="pair-small">Expires after five minutes. Leave this screen open while approving.</p><p class="pair-url"><a href="{{.URL}}">{{.URL}}</a></p><p id="pair-status" role="status">Waiting for approval…</p></main></body></html>
