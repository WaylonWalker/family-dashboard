<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Approve Family HQ frame</title><style>body{font:18px system-ui;background:#edf3ef;color:#193831;padding:18px}main{max-width:480px;margin:10vh auto;background:white;border-radius:18px;padding:26px;box-shadow:0 8px 30px #0001}label{display:block;margin-bottom:8px}input{font:inherit;padding:12px;width:100%;box-sizing:border-box;border-radius:6px;border:1px solid #9db6aa}button{font:inherit;padding:14px 20px;margin-top:20px;background:#204f44;color:white;border:0;border-radius:8px;width:100%}small{display:block;margin-top:18px}</style></head><body><main><h1>Approve this photo frame?</h1><p>This display will have <strong>read access to family calendar and weather</strong>, and can <strong>complete family tasks</strong>. It will not have your phone's admin session or edit permissions.</p><form method="post" action="/pair/approve"><input type="hidden" name="code" value="{{.Code}}"><input type="hidden" name="csrf" value="{{.CSRF}}"><label for="name">Frame name</label><input id="name" name="name" required maxlength="48" value="Kitchen photo frame"><button type="submit">Approve display</button></form><small>Only approve a frame you recognize. Pairing expires in five minutes; you can revoke it later.</small></main></body></html>
