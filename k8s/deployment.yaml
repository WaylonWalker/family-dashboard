apiVersion: apps/v1
kind: Deployment
metadata:
  name: family-dashboard
  labels:
    app.kubernetes.io/name: family-dashboard
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate # One writer for the RWO tasks.json volume.
  selector:
    matchLabels:
      app.kubernetes.io/name: family-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: family-dashboard
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: ghcr.io/waylonwalker/family-dashboard:sha-c0aab99ca022441b69e436ce2dad320f4546d68f@sha256:11ec0b0f9e610a59eeddb41813f92b0379cbbffa4af8fe39e822b4ec455f29aa
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ':8080'
            - name: TASKS_FILE
              value: /data/tasks.json
            - name: DEVICES_FILE
              value: /data/devices.json
            - name: FAMILY_AUTH_MODE
              value: proxy
            - name: FAMILY_PUBLIC_URL
              value: https://family.wayl.one
            - name: FAMILY_TRUSTED_PROXY_CIDRS
              value: "10.42.0.15/32" # Current Traefik pod IP; NetworkPolicy also restricts ingress to Traefik pods.
            - name: PLAY_OUTSIDE_OPEN_WEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: family-dashboard-weather
                  key: PLAY_OUTSIDE_OPEN_WEATHER_API_KEY
                  optional: true
            - name: WEATHER_LATITUDE
              value: "40.6936"
            - name: WEATHER_LONGITUDE
              value: "-89.5890"
            - name: WEATHER_LOCATION_NAME
              value: "Peoria area"
            - name: GOOGLE_CALENDAR_ICAL_URL
              valueFrom:
                secretKeyRef:
                  name: family-dashboard-calendar
                  key: GOOGLE_CALENDAR_ICAL_URL
                  optional: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tasks
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
      volumes:
        - name: tasks
          persistentVolumeClaim:
            claimName: family-dashboard-data
