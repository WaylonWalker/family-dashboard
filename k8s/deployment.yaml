apiVersion: apps/v1
kind: Deployment
metadata:
  name: family-dashboard
  labels:
    app.kubernetes.io/name: family-dashboard
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate # One writer for the RWO tasks.json volume.
  selector:
    matchLabels:
      app.kubernetes.io/name: family-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: family-dashboard
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: registry.wayl.one/family-dashboard:sha-dfc33efd9fa3dcc7fbf34954fd2063a992a96bac@sha256:5aac1a6b744c3f6a9a89d0501da6f1980d543345b1032c560d889fb9b7d93a17
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ':8080'
            - name: TASKS_FILE
              value: /data/tasks.json
            - name: DEVICES_FILE
              value: /data/devices.json
            - name: FAMILY_AUTH_MODE
              value: proxy
            - name: FAMILY_PUBLIC_URL
              value: https://family.wayl.one
            - name: SENSOR_BACKEND_URL
              value: http://notify-bridge-app.notify-bridge.svc.cluster.local:8000/api/dashboard/sensors
            - name: FRIGATE_BASE_URL
              value: http://frigate.frigate.svc.cluster.local:5000
            - name: FAMILY_ALLOWED_ORIGINS
              value: https://fam.wayl.one,https://family.waylonwalker.com,https://fam.waylonwalker.com
            - name: FAMILY_TRUSTED_PROXY_CIDRS
              value: "10.42.0.15/32" # Current Traefik pod IP; NetworkPolicy also restricts ingress to Traefik pods.
            - name: PLAY_OUTSIDE_OPEN_WEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: family-dashboard-weather
                  key: PLAY_OUTSIDE_OPEN_WEATHER_API_KEY
                  optional: true
            - name: WEATHER_LATITUDE
              value: "40.6936"
            - name: WEATHER_LONGITUDE
              value: "-89.5890"
            - name: WEATHER_LOCATION_NAME
              value: "Peoria area"
            - name: GOOGLE_CALENDAR_ICAL_URL
              valueFrom:
                secretKeyRef:
                  name: family-dashboard-calendar
                  key: GOOGLE_CALENDAR_ICAL_URL
                  optional: true
            - name: FAMILY_TRAVEL_RULES_JSON
              valueFrom:
                secretKeyRef:
                  name: family-dashboard-travel
                  key: FAMILY_TRAVEL_RULES_JSON
            - name: FRIGATE_EVENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: family-dashboard-frigate
                  key: FRIGATE_EVENT_TOKEN
            - name: DASHBOARD_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: family-dashboard-frigate
                  key: DASHBOARD_CONTROL_TOKEN
                  optional: true
            - name: OTEL_SERVICE_NAME
              value: family-dashboard
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tasks
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
      volumes:
        - name: tasks
          persistentVolumeClaim:
            claimName: family-dashboard-data
