apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: family-dashboard-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: family-dashboard
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: notify-bridge
          podSelector:
            matchLabels:
              app: notify-bridge-app
      ports:
        - protocol: TCP
          port: 8080
