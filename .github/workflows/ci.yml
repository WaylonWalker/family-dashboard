name: CI and image
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '*.go'
      - 'go.mod'
      - 'web/**'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
      - 'k8s/**'
      - 'justfile'
      - 'scripts/**'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/test_pair_qr.cjs
      - run: go build ./...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
  publish:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/waylonwalker/family-dashboard:sha-${{ github.sha }}
